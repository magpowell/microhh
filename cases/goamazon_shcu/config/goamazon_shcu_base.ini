# GoAmazon composite shallow-cumulus case
# Settings common to both RT modes; merged with goamazon_shcu_2stream.ini or
# goamazon_shcu_raytracer.ini by the setup scripts.
#
# Composite of 6 pure, non-precipitating shallow-Cu days (Manco & Figueroa
# 2025, Atmosphere 16(7):789), GoAmazon 2014/15, centered near Manaus.
# No deep transition by construction -- shallow-only counterpart to the
# goamazon (single pulse) and arm97sd cases. t=0 is 06:00 LT (10:00 UTC);
# 14 h to 20:00 LT.
#
# Shallow-only domain (much shallower than goamazon/arm97sd's deep-conv
# grid): reuses CASS's validated shallow-Cu grid (512x512x256, dx=50m,
# dz=25m, zsize=6.4km) -- no fit test needed, same grid CASS already runs
# the raytracer on comfortably.

[master]
npx=1
npy=1

[grid]
zsize=6400
ktot=256
itot=512
jtot=512
xsize=25600
ysize=25600

swspatialorder=2

# SIPAM Ponta Pelada, Manaus (CAMZ octagon center; Manco & Figueroa 2025)
lat=-3.15
lon=-59.99

[advec]
cflmax=1.2
swadvec=2i5
fluxlimit_list=qt,qr

[diff]
swdiff=smag2
dnmax=0.3

[thermo]
swthermo=moist
swbasestate=anelastic
pbot=104000.
swupdatebasestate=1

[micro]
# Pure non-precipitating ShCu by construction -- no ice expected;
# warm-rain only, matches CASS. (swqsqg_to_rad not applicable: 2mom_warm
# has no qs/qg fields.)
swmicro=2mom_warm
swmicrobudget=0
cflmax=2.0
Nc0=200e6

[force]
# No Coriolis (composite forcing has no geostrophic wind component; matches
# the paper's own SAM setup, which nudges directly to the forcing u/v).
swls=1
lslist=thl,qt
swwls=local
swtimedep_wls=1
swtimedep_ls=1
timedeplist_ls=thl,qt

swnudge=1
swtimedep_nudge=1
nudgelist=u,v
timedeplist_nudge=u,v

[fields]
visc=0
svisc=0

rndseed=1
rndamp[thl]=0.1
rndamp[qt]=1.e-4
rndz=200.
rndexp=2.

[buffer]
swbuffer=1
swupdate=1
zstart=4800
sigma=0.00223
beta=2.

[time]
endtime=50400
dt=6.
dtmax=60.
savetime=3600
outputiter=20
adaptivestep=true
starttime=0.
rkorder=4

[limiter]
limitlist=qt,qr

[stats]
swstats=1
sampletime=300

[cross]
swcross=1
sampletime=60
xy=0
crosslist=qlqi_path,qlqi_base,qlqi_top,qlqicore_max_thv_prime,sw_flux_dn,sw_flux_dn_dir,thl_fluxbot,qt_fluxbot,sw_flux_sfc_dir_rt,sw_flux_sfc_dif_rt,lw_flux_up,lw_flux_dn

[dump]
swdump=1
sampletime=3600
dumplist=T,ql,qt,thl,w,b,qr

[column]
swcolumn=1
sampletime=60
# coordinates[x/y] set by the setup script from xsize/ysize

[aerosol]
swaerosol=false
