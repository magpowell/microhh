# ARM97 shallow-to-deep LES base configuration
# Settings common to both RT modes; merged with arm97sd_2stream.ini or
# arm97sd_raytracer.ini by the setup scripts.
#
# Case: SGP 27 June 1997 shallow-to-deep transition (EUROCS/GCSS lineage,
# Guichard et al. 2004), carved from the ARM97 IOP forcing.
# t=0 is 11:30 UTC = 05:30 CST; 16.5 h simulation (ends 04:00 UTC, ~2 h
# past sunset).

[master]
npx=1
npy=1

[grid]
# Identical to the GoAmazon production grid (dz67_k384) for cross-case
# comparability. Uniform dz is REQUIRED by radiation_rrtmgp_rt.
zsize=25600
ktot=384
itot=512
jtot=512
xsize=102400
ysize=102400

swspatialorder=2

# ARM SGP central facility
lat=36.605
lon=-97.485

[advec]
cflmax=1.2
swadvec=2i5
fluxlimit_list=qt,qr,qs,qg

[diff]
swdiff=smag2
dnmax=0.3

[thermo]
swthermo=moist
swbasestate=anelastic
pbot=97400.
swupdatebasestate=1
# SCREAM/P3 category parity: frozen precipitation (qs+qg) is radiatively
# active (added to the radiation ciwp); rain stays invisible.
swqsqg_to_rad=1

[micro]
swmicro=nsw6
swmicrobudget=0
cflmax=1.2
Nc0=200e6

[force]
# No Coriolis (iop_coriolis=false), no subsidence (iop_dosubsidence=false;
# EAMxx applies divT/divq only -- vertdivT unused).
swls=1
lslist=thl,qt
swtimedep_ls=1
timedeplist_ls=thl,qt

# u/v nudged to IOP u/v (no u_ls/v_ls in ARM97), tau=10800 s
swnudge=1
swtimedep_nudge=1
nudgelist=u,v
timedeplist_nudge=u,v

[fields]
visc=0
svisc=0

rndseed=1
rndamp[thl]=0.1
rndamp[qt]=1.e-4
rndz=200.
rndexp=2.

[buffer]
swbuffer=1
swupdate=1
zstart=20000
sigma=0.00223
beta=2.

[time]
endtime=59400
dt=6.
dtmax=30.
savetime=3600
outputiter=20
adaptivestep=true
starttime=0.
rkorder=4

[limiter]
limitlist=qt,qr,qs,qg

[stats]
swstats=1
sampletime=300

[cross]
swcross=1
sampletime=60
xy=0
crosslist=qlqi_path,qlqi_base,qlqi_top,qlqicore_max_thv_prime,sw_flux_dn,sw_flux_dn_dir,thl_fluxbot,qt_fluxbot,sw_flux_sfc_dir_rt,sw_flux_sfc_dif_rt,lw_flux_up,lw_flux_dn,rr_bot

[dump]
swdump=1
sampletime=3600
dumplist=T,ql,qi,qt,thl,w,b,qr,qs,qg

[column]
swcolumn=1
sampletime=60
# coordinates[x/y] set by the setup script from xsize/ysize

[aerosol]
swaerosol=false
