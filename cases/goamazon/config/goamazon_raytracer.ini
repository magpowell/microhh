# GoAmazon 3D ray tracer + LSM configuration

[time]
datetime_utc=2014-10-05 12:00:00

[boundary]
swboundary=surface_lsm
swconstantz0=1
mbcbot=noslip
mbctop=freeslip
sbcbot=dirichlet
sbctop=neumann
sbot=0
stop=0
# Amazon rainforest canopy. Values from ERA5 surface_an at the site (12 UTC
# 2014-10-05): tvh=6, fsr=1.30 m, lai_hv=5.35, cvh=0.91
z0m=1.3
z0h=0.13

[land_surface]
swhomogeneous=1
swfreedrainage=1
swtilestats=0
swtilestats_column=0
switerseb=0
swwater=0
ktot=4

# IFS type 6 (evergreen broadleaf). gD in Pa-1: IFS 0.03 hPa-1 -> 3e-4.
gD=0.0003
c_veg=0.91
lai=5.35
rs_veg_min=250
rs_soil_min=50

lambda_stable=10.0
lambda_unstable=10.0

cs_veg=0
emis_sfc=0.98
sfc_alb_dir=0.13
sfc_alb_dif=0.13

[radiation]
swradiation=rrtmgp_rt
rays_per_pixel=256
kngrid_i=64
kngrid_j=64
kngrid_k=32
emis_sfc=0.98
swlongwave=1
swshortwave=1
dt_rad=60
# IOP Tg at 12:00 UTC
t_sfc=300.6
tsi_scaling=1
sfc_alb_dir=0.13
sfc_alb_dif=0.13
swclearskystats=1
swfixedsza=0
swtimedep_background=0
