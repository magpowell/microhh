# GoAmazon single-pulse LES base configuration
# Settings common to both RT modes; merged with goamazon_2stream.ini or
# goamazon_raytracer.ini by the setup scripts.
#
# Case: GoAmazon day 278 (2014-10-05), "early single peak convection",
# forcing from Tian & Zhang (2025) via the DP-SCREAM IOP file.
# t=0 is 12:00 UTC = 08:00 LT; 12 h simulation.

[master]
npx=1
npy=1

[grid]
# Default production candidate; the fit test may revise (see base/).
# Uniform dz is REQUIRED by radiation_rrtmgp_rt.
zsize=25600
ktot=256
itot=512
jtot=512
xsize=102400
ysize=102400

swspatialorder=2

# GoAmazon T3 site (Manacapuru)
lat=-3.2
lon=-60.6

[advec]
cflmax=1.2
swadvec=2i5
fluxlimit_list=qt,qr,qs,qg

[diff]
swdiff=smag2
dnmax=0.3

[thermo]
swthermo=moist
swbasestate=anelastic
pbot=101000.
swupdatebasestate=1
# SCREAM/P3 category parity: frozen precipitation (qs+qg) is radiatively
# active (added to the radiation ciwp); rain stays invisible.
swqsqg_to_rad=1

[micro]
swmicro=nsw6
swmicrobudget=0
cflmax=1.2
Nc0=200e6

[force]
# No Coriolis / geostrophic forcing (iop_coriolis=false, lat=-3.2).
# No subsidence: divT/divq are total advective forcings
# (iop_dosubsidence=false in DP-SCREAM).
swls=1
lslist=thl,qt
swtimedep_ls=1
timedeplist_ls=thl,qt

# u/v nudged to IOP u_ls/v_ls, tau=10800 s (EAMxx iop_nudge_tscale)
swnudge=1
swtimedep_nudge=1
nudgelist=u,v
timedeplist_nudge=u,v

[fields]
visc=0
svisc=0

rndseed=1
rndamp[thl]=0.1
rndamp[qt]=1.e-4
rndz=200.
rndexp=2.

[buffer]
swbuffer=1
swupdate=1
zstart=20000
sigma=0.00223
beta=2.

[time]
endtime=43200
dt=6.
dtmax=30.
savetime=3600
outputiter=20
adaptivestep=true
starttime=0.
rkorder=4

[limiter]
limitlist=qt,qr,qs,qg

[stats]
swstats=1
sampletime=300

[cross]
swcross=1
sampletime=60
xy=0
crosslist=qlqi_path,qlqi_base,qlqi_top,qlqicore_max_thv_prime,sw_flux_dn,sw_flux_dn_dir,thl_fluxbot,qt_fluxbot,sw_flux_sfc_dir_rt,sw_flux_sfc_dif_rt,lw_flux_up,lw_flux_dn

[dump]
swdump=1
sampletime=3600
dumplist=T,ql,qi,qt,thl,w,b,qr,qs,qg

[column]
swcolumn=1
sampletime=60
# coordinates[x/y] set by the setup script from xsize/ysize

[aerosol]
swaerosol=false
