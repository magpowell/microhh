# CASS LES Base Configuration
# This file contains settings common to all CASS configurations.
# Merged with cass_2stream.ini or cass_raytracer.ini by the setup scripts.

[master]
npx=1
npy=1

[grid]
zsize=6400
ktot=256
# Production settings:
itot=512
jtot=512
xsize=25600
ysize=25600

# Test/debug settings:
; itot=64
; jtot=64
; xsize=6400.
; ysize=6400.

swspatialorder=2

# Location: ARM SGP central facility
lat=36.5
lon=-97.5

[advec]
cflmax=1.2
swadvec=2i5
fluxlimit_list=qt,qr,nr

[diff]
swdiff=smag2
dnmax=0.3

[thermo]
swthermo=moist
swbasestate=anelastic
pbot=97000.
swupdatebasestate=1

[micro]
swmicro=2mom_warm
swmicrobudget=0
cflmax=2.0
Nc0=200e6

[force]
swtimedep_wls=1
# Large-scale pressure gradient (geostrophic)
swlspres=geo
fc=8.5e-5  # Coriolis parameter at 36.5N

# Large-scale forcings
swls=1
lslist=thl,qt
swwls=local
swtimedep_ls=1
timedeplist_ls=thl,qt

# Nudging
swnudge=1
swtimedep_nudge=1
nudgelist=u,v
timedeplist_nudge=u,v

[fields]
visc = 0
svisc = 0

rndseed=2
rndamp[thl]=0.1
rndamp[qt]=1.e-4
rndz=200.
rndexp=2.

[buffer]
swbuffer=1
swupdate=1
zstart=4800
sigma=0.00223
beta=2.

[time]
endtime = 50000.0
dt=6.
dtmax=60.
savetime=3600
outputiter=20
adaptivestep=true
starttime=0.
rkorder=4

[limiter]
limitlist=qt,qr,nr

[stats]
swstats=1
sampletime=300

[cross]
swcross=1
sampletime=60
xy=0
crosslist=qlqi_path,qlqi_base,qlqi_top,qlqicore_max_thv_prime,sw_flux_dn,sw_flux_dn_dir,thl_fluxbot,qt_fluxbot,sw_flux_sfc_dir_rt,sw_flux_sfc_dif_rt,lw_flux_up,lw_flux_dn,thl,qt,ql,w,b

[dump]
swdump = 1
sampletime = 3600
dumplist = T,ql,qi,qt,thl,w,b

[column]
swcolumn=1
sampletime=60
# Coordinates will be set based on grid size by setup script

[aerosol]
swaerosol=true
swtimedep=false
